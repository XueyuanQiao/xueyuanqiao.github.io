---
layout: default
---

<section>
    <h2>{{page.title}}</h2>
    <p>以下是分类 "{{page.title}}" 的所有文章：</p>
    
    {% for post in site.posts %}
        {% if post.categories contains page.category %}
            <div class="category-post">
                <h3><a href="{{post.url}}">{{post.title}}</a></h3>
                <p>{{post.excerpt}}</p>
                <div class="post-meta">
                    <span class="date">{{post.date | date: "%Y-%m-%d"}}</span>
                </div>
            </div>
        {% endif %}
    {% endfor %}
</section>
