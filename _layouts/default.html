<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <meta name="color-scheme" content="dark light">

    <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
    {% if page.tags %}<meta name="keywords" content="{{ page.tags | join: ', ' }}">{% endif %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- Apply theme before paint to avoid flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aurora-theme');
          if (!t) {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          }
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">

    <link rel="stylesheet" href="{{ '/assets/css/aurora.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/code.css' | relative_url }}">

    {% feed_meta %}
    {% seo %}
</head>
<body class="{% if page.layout == 'landing' or page.is_landing %}is-landing{% endif %}">
    <canvas class="bg-neural" aria-hidden="true"></canvas>
    <div class="bg-aurora" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="read-progress" aria-hidden="true"></div>

    <button class="menu-toggle" aria-label="切换菜单" type="button"><span></span></button>
    <div class="scrim" aria-hidden="true"></div>

    <div class="app">
        <aside class="sidebar" aria-label="主导航">
            <div class="brand">
                <a href="{{ '/' | relative_url }}" class="avatar" aria-label="返回首页">
                    <img src="{{ '/images/head.jpeg' | relative_url }}" alt="头像">
                </a>
                <div>
                    <div class="brand-name">{{ site.title | default: "雪源的博客" }}</div>
                    <p class="brand-tagline">{{ site.description | strip | truncate: 30 }}</p>
                </div>
            </div>

            <nav>
                <ul class="nav">
                    <li><a href="{{ '/' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
                        首页
                    </a></li>
                    <li><a href="{{ '/archive.html' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a2 2 0 0 1-2 2h-3v-7H9v7H6a2 2 0 0 1-2-2z"/></svg>
                        文章
                    </a></li>
                    <li><a href="{{ '/cate.html' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                        分类
                    </a></li>
                    <li><a href="{{ '/doc.html' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07L11 5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07L13 19"/></svg>
                        链接
                    </a></li>
                    <li><a href="{{ '/about.html' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
                        关于
                    </a></li>
                </ul>
            </nav>

            <div class="sidebar-foot">
                <div class="social">
                    {% if site.github_username %}
                    <a class="icon-btn" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener" aria-label="GitHub">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.18c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.27-1.69-1.27-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.96.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.27-5.24-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.17.92-.26 1.9-.39 2.88-.39.98 0 1.96.13 2.88.39 2.2-1.49 3.16-1.17 3.16-1.17.62 1.58.23 2.75.11 3.04.74.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.36-5.25 5.65.41.35.78 1.05.78 2.12v3.14c0 .31.21.67.8.56 4.57-1.52 7.85-5.83 7.85-10.91C23.5 5.65 18.35.5 12 .5z"/></svg>
                    </a>
                    {% endif %}
                    <a class="icon-btn" href="{{ '/feed.xml' | relative_url }}" aria-label="RSS">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3v3a15 15 0 0 1 15 15h3A18 18 0 0 0 5 3zm0 7v3a8 8 0 0 1 8 8h3a11 11 0 0 0-11-11zm1.5 8a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
                    </a>
                    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    </button>
                </div>
            </div>
        </aside>

        <main class="main" id="main">
            {{ content }}
        </main>
    </div>

    <button class="fab fab-top" aria-label="回到顶部" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>

    <script src="{{ '/js/highlight.pack.js' | relative_url }}"></script>
    <script>
      if (window.hljs && hljs.highlightAll) hljs.highlightAll();
      else if (window.hljs && hljs.initHighlightingOnLoad) hljs.initHighlightingOnLoad();
    </script>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
