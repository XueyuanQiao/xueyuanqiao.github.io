<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <meta name="color-scheme" content="dark light">

    <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
    {% if page.tags %}<meta name="keywords" content="{{ page.tags | join: ', ' }}">{% endif %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon.png' | relative_url }}">

    <!-- Apply theme before paint to avoid flash -->
    <!-- 默认暗色：仅在用户显式选择 light 时切换为亮色 -->
    <script>
      (function () {
        var t = 'dark';
        try {
          if (localStorage.getItem('aurora-theme') === 'light') t = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"></noscript>

    <link rel="stylesheet" href="{{ '/assets/css/aurora.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/code.css' | relative_url }}">

    {% feed_meta %}
    {% seo %}
</head>
<body class="{% if page.layout == 'landing' or page.is_landing %}is-landing{% endif %}">
    <canvas class="bg-neural" aria-hidden="true"></canvas>
    <div class="bg-aurora" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="read-progress" aria-hidden="true"></div>

    <button class="menu-toggle" aria-label="切换菜单" aria-controls="site-sidebar" aria-expanded="false" type="button"><span></span></button>
    <div class="scrim" aria-hidden="true"></div>

    <div class="app">
        <aside class="sidebar" id="site-sidebar" aria-label="主导航">
            <div class="brand">
                <a href="{{ '/' | relative_url }}" class="avatar" aria-label="返回首页">
                    <picture>
                        <source type="image/webp"
                                srcset="{{ '/images/head-96.webp' | relative_url }} 96w, {{ '/images/head-160.webp' | relative_url }} 160w, {{ '/images/head-256.webp' | relative_url }} 256w"
                                sizes="96px">
                        <img src="{{ '/images/head.jpeg' | relative_url }}" alt="头像" width="96" height="96" loading="eager" decoding="async">
                    </picture>
                </a>
                <div>
                    <div class="brand-name">{{ site.title | default: "雪源的博客" }}</div>
                    <p class="brand-tagline">{{ site.description | strip | truncate: 30 }}</p>
                </div>
            </div>

            <nav>
                <ul class="nav">
                    <li><a href="{{ '/' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
                        首页
                    </a></li>
                    <li><a href="{{ '/archive.html' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a2 2 0 0 1-2 2h-3v-7H9v7H6a2 2 0 0 1-2-2z"/></svg>
                        文章
                    </a></li>
                    <li><a href="{{ '/cate.html' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                        分类
                    </a></li>
                    <li><a href="{{ '/doc.html' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07L11 5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07L13 19"/></svg>
                        链接
                    </a></li>
                    <li><a href="{{ '/about.html' | relative_url }}">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
                        关于
                    </a></li>
                    <li>
                        <button class="nav-search" type="button" data-search-open aria-keyshortcuts="Meta+K Control+K /">
                            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
                            <span>搜索</span>
                            <kbd data-search-shortcut>⌘ K</kbd>
                        </button>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-foot">
                <div class="social">
                    {% if site.github_username %}
                    <a class="icon-btn" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener" aria-label="GitHub">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.18c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.27-1.69-1.27-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.96.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.27-5.24-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.17.92-.26 1.9-.39 2.88-.39.98 0 1.96.13 2.88.39 2.2-1.49 3.16-1.17 3.16-1.17.62 1.58.23 2.75.11 3.04.74.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.36-5.25 5.65.41.35.78 1.05.78 2.12v3.14c0 .31.21.67.8.56 4.57-1.52 7.85-5.83 7.85-10.91C23.5 5.65 18.35.5 12 .5z"/></svg>
                    </a>
                    {% endif %}
                    <a class="icon-btn" href="{{ '/feed.xml' | relative_url }}" aria-label="RSS">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3v3a15 15 0 0 1 15 15h3A18 18 0 0 0 5 3zm0 7v3a8 8 0 0 1 8 8h3a11 11 0 0 0-11-11zm1.5 8a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
                    </a>
                </div>
                <button class="theme-switch" type="button" data-theme-toggle aria-label="切换主题（暗色 / 亮色）" title="切换暗色 / 亮色主题">
                    <span class="theme-switch__track" aria-hidden="true">
                        <span class="theme-switch__icon theme-switch__icon--moon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                        </span>
                        <span class="theme-switch__icon theme-switch__icon--sun">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                        </span>
                        <span class="theme-switch__thumb"></span>
                    </span>
                    <span class="theme-switch__label" data-theme-label-dark>暗色模式</span>
                    <span class="theme-switch__label" data-theme-label-light>亮色模式</span>
                </button>
            </div>
        </aside>

        <main class="main" id="main">
            {{ content }}
        </main>
    </div>

    <dialog class="search-dialog" data-search-dialog data-index-url="{{ '/category/category.json' | relative_url }}" aria-labelledby="site-search-title">
        <div class="search-dialog__panel">
            <header class="search-dialog__header">
                <div>
                    <span class="search-dialog__eyebrow">// command palette</span>
                    <h2 id="site-search-title">搜索文章</h2>
                </div>
                <button class="search-dialog__close" type="button" data-search-close aria-label="关闭搜索">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </header>
            <label class="search-box" for="site-search-input">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
                <input id="site-search-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="true" inputmode="search" autocomplete="off" placeholder="搜索标题、摘要或分类…" data-search-input aria-controls="site-search-results" aria-describedby="site-search-help">
                <kbd>ESC</kbd>
            </label>
            <p class="search-dialog__help" id="site-search-help">输入关键词搜索，使用 ↑ ↓ 选择，Enter 打开。</p>
            <div class="search-results" id="site-search-results" data-search-results role="listbox" aria-label="搜索结果"></div>
            <p class="search-status" data-search-status aria-live="polite"></p>
        </div>
    </dialog>

    <button class="fab fab-top" aria-label="回到顶部" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
