<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="refresh" content="1; url={{ page.redirect_to | relative_url }}">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <title>{{ page.title | default: '正在跳转' }} · {{ site.title }}</title>
    <script>
      (function () {
        var target = {{ page.redirect_to | relative_url | jsonify }};
        window.location.replace(target + window.location.search + window.location.hash);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #0b1020;
        color: #dce7ff;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 25%, rgba(89, 227, 255, 0.12), transparent 30rem),
          #0b1020;
      }
      main {
        width: min(88vw, 30rem);
        padding: 2rem;
        text-align: center;
        border: 1px solid rgba(138, 120, 255, 0.25);
        border-radius: 1rem;
        background: rgba(20, 27, 49, 0.82);
      }
      p { margin: 0 0 1rem; line-height: 1.7; }
      a { color: #59e3ff; text-underline-offset: 0.2em; }
    </style>
</head>
<body>
    <main>
        <p>正在前往目标页面……</p>
        <a href="{{ page.redirect_to | relative_url }}">如果没有自动跳转，请点击这里</a>
    </main>
</body>
</html>
