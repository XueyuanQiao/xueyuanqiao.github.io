---
layout: default
---

<article class="page{% if page.hide_header %} page-bare{% endif %}">
    {% unless page.hide_header %}
    <header class="page-header">
        <h1>{{ page.title }}</h1>
        {% if page.excerpt %}<p class="page-subtitle">{{ page.excerpt }}</p>{% endif %}
    </header>
    {% endunless %}

    <div class="page-content">
        {{ content }}
    </div>
</article>
