---
layout: page
title: 分类
excerpt: 按标签查看文章
hide_header: true
---

<section class="hero hero-compact">
    <span class="hero-eyebrow"><span class="dot"></span>// filter · 标签筛选</span>
    <h1 data-cate-heading>全部<span class="grad-text"> 分类</span></h1>
    <p>从首页或分类页选择标签可在此查看相关文章。</p>
</section>

<div class="cate-cloud" data-cloud>
    <span class="cate-chip is-skel"></span>
    <span class="cate-chip is-skel"></span>
    <span class="cate-chip is-skel"></span>
    <span class="cate-chip is-skel"></span>
    <span class="cate-chip is-skel"></span>
</div>

<ul class="cate-list" data-list>
    <li class="is-skel"><span class="skel-bar skel-bar-lg"></span><span class="skel-bar skel-bar-sm"></span></li>
    <li class="is-skel"><span class="skel-bar skel-bar-lg"></span><span class="skel-bar skel-bar-sm"></span></li>
    <li class="is-skel"><span class="skel-bar skel-bar-lg"></span><span class="skel-bar skel-bar-sm"></span></li>
</ul>

<p class="cate-empty" data-empty hidden>该分类下暂无文章。</p>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var tag = params.get('tag') || '';
  var cloud = document.querySelector('[data-cloud]');
  var list = document.querySelector('[data-list]');
  var empty = document.querySelector('[data-empty]');
  var heading = document.querySelector('[data-cate-heading]');

  fetch('{{ "/category/category.json" | relative_url }}', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var posts = (data && data.posts) || [];
      var counts = {};
      posts.forEach(function (p) {
        (p.categories || []).forEach(function (c) {
          var k = String(c).toLowerCase();
          counts[k] = counts[k] || { name: c, n: 0, latest: '' };
          counts[k].n += 1;
          if ((p.date || '') > counts[k].latest) counts[k].latest = p.date || '';
        });
      });

      // Sort categories by their latest post date (desc), then by name as tiebreaker.
      var keys = Object.keys(counts).sort(function (a, b) {
        var la = counts[a].latest, lb = counts[b].latest;
        if (la !== lb) return lb.localeCompare(la);
        return a.localeCompare(b);
      });
      var allBtn = '<button class="cate-chip ' + (tag ? '' : 'is-active') + '" data-c="">全部 <span class="count">' + posts.length + '</span></button>';
      var html = allBtn + keys.map(function (k) {
        var item = counts[k];
        var active = tag && tag.toLowerCase() === k ? ' is-active' : '';
        return '<button class="cate-chip' + active + '" data-c="' + encodeURIComponent(item.name) + '">' + escapeHTML(item.name) + ' <span class="count">' + item.n + '</span></button>';
      }).join('');
      cloud.innerHTML = html;

      cloud.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var c = decodeURIComponent(btn.dataset.c || '');
          var url = c ? ('?tag=' + encodeURIComponent(c)) : location.pathname;
          history.replaceState(null, '', url);
          render(posts, c);
          cloud.querySelectorAll('button').forEach(function (b) {
            b.classList.toggle('is-active', (b.dataset.c || '') === (c ? encodeURIComponent(c) : ''));
          });
        });
      });

      render(posts, tag);
    })
    .catch(function () {
      if (list) list.innerHTML = '<li class="cate-empty">加载文章失败</li>';
    });

  function render(posts, tag) {
    var filtered = tag
      ? posts.filter(function (p) {
          return (p.categories || []).some(function (c) { return String(c).toLowerCase() === String(tag).toLowerCase(); });
        })
      : posts;

    if (heading) {
      heading.innerHTML = tag
        ? (escapeHTML(tag) + '<span class="grad-text"> · 已筛选</span>')
        : '全部<span class="grad-text"> 分类</span>';
    }

    if (!filtered.length) {
      list.innerHTML = '';
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    filtered.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
    list.innerHTML = filtered.map(function (p) {
      return '<li>' +
        '<a href="' + p.url + '">' + escapeHTML(p.title) + '</a>' +
        '<span class="date">' + escapeHTML(p.date || '') + '</span>' +
        '</li>';
    }).join('');
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m];
    });
  }
})();
</script>
