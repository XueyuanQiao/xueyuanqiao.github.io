---
layout: default
title: 文章分类
---

<script>
// 获取URL参数中的tag值
const urlParams = new URLSearchParams(window.location.search);
const tag = urlParams.get('tag');

// 如果有tag参数，更新页面内容
if (tag) {
  document.addEventListener('DOMContentLoaded', function() {
    const titleElement = document.querySelector('h2');
    const introElement = document.querySelector('p.intro');
    const postsContainer = document.querySelector('.posts-container');
    
    if (titleElement) {
      titleElement.textContent = tag;
    }
    
    if (introElement) {
      introElement.textContent = `以下是分类 "${tag}" 的所有文章：`;
    }
    
    // 发送请求获取该分类的文章
    fetch('/category/category.json')
      .then(response => response.json())
      .then(data => {
        if (postsContainer) {
          // 清空容器
          postsContainer.innerHTML = '';
          
          // 筛选该分类的文章（不区分大小写）
          const filteredPosts = data.posts.filter(post => 
            post.categories.some(category => 
              category.toLowerCase() === tag.toLowerCase()
            )
          );
          
          // 显示文章列表
          if (filteredPosts.length > 0) {
            filteredPosts.forEach(post => {
              const postElement = document.createElement('div');
              postElement.className = 'category-post';
              postElement.innerHTML = `
                <h3><a href="${post.url}">${post.title}</a></h3>
                <p>${post.excerpt}</p>
                <div class="post-meta">
                  <span class="date">${post.date}</span>
                </div>
              `;
              postsContainer.appendChild(postElement);
            });
          } else {
            postsContainer.innerHTML = '<p>该分类下暂无文章</p>';
          }
        }
      })
      .catch(error => {
        console.error('Error fetching posts:', error);
        if (postsContainer) {
          postsContainer.innerHTML = '<p>加载文章失败</p>';
        }
      });
  });
}
</script>

<section>
    <h2>文章分类</h2>
    <p class="intro">请从首页选择一个分类标签查看相关文章</p>
    
    <div class="posts-container">
        <!-- 文章列表将通过JavaScript动态生成 -->
    </div>
</section>
