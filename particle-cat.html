layout: null
permalink: /
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#02050b">
    <meta name="color-scheme" content="dark">
    <title>{{ site.title }}</title>
    <meta name="description" content="由星系、星云与星尘组成的实时互动宇宙首页。">
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/particle-cat.css' | relative_url }}">
</head>
<body>
    <div class="space-backdrop" aria-hidden="true">
        <div class="space-backdrop__image"></div>
        <div class="space-backdrop__veil"></div>
    </div>

    <canvas
        id="cat-particle-stage"
        aria-label="可互动的宇宙星系、星云与粒子星尘"
    ></canvas>

    <div class="particle-ambient" aria-hidden="true"></div>
    <div class="particle-vignette" aria-hidden="true"></div>

    <main class="particle-entry" aria-label="博客入口">
        <a class="particle-enter" href="{{ '/blog/' | relative_url }}">
            <span class="particle-enter__copy">
                <small>继续探索</small>
                <strong>进入博客</strong>
            </span>
            <b aria-hidden="true">↗</b>
        </a>

        <div class="particle-controls" aria-label="粒子效果开关">
            <button type="button" data-particle-trigger>星云爆发</button>
            <button type="button" data-particle-flow aria-pressed="true">星轨流动：开</button>
            <button type="button" data-particle-glow aria-pressed="true">宇宙辉光：开</button>
            <button class="particle-reset" type="button" data-particle-reset aria-label="重置宇宙视角" title="重置宇宙视角">重置宇宙</button>
        </div>

    </main>

    <p class="space-credit">背景影像：NASA / ESA / CSA / STScI</p>

    <p class="particle-loading" role="status">正在生成互动宇宙…</p>

    <div class="particle-fallback" role="status">
        <p>互动宇宙暂时无法显示</p>
        <a href="{{ '/blog/' | relative_url }}">进入博客 →</a>
    </div>

    <noscript>
        <div class="particle-noscript">需要启用 JavaScript 才能观看互动宇宙。<a href="{{ '/blog/' | relative_url }}">进入博客</a></div>
    </noscript>

    <script src="{{ '/assets/js/particle-cat.js' | relative_url }}" defer></script>
</body>
</html>
