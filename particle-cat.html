---
layout: null
permalink: /
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#02050b">
    <meta name="color-scheme" content="dark">
    <title>{{ site.title }}</title>
    <meta name="description" content="由星系、星云与星尘组成的实时互动宇宙首页。">
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="{{ '/images/space-panorama-360.webp' | relative_url }}">
    <link rel="prefetch" href="{{ '/blog/' | relative_url }}" as="document">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/particle-cat.css' | relative_url }}">
</head>
<body>
    <div class="space-backdrop" aria-hidden="true">
        <canvas
            id="space-panorama"
            data-panorama-src="{{ '/images/space-panorama-360.webp' | relative_url }}"
            data-panorama-mobile-src="{{ '/images/space-panorama-360-mobile.webp' | relative_url }}"
        ></canvas>
        <div class="space-backdrop__veil"></div>
    </div>

    <canvas
        id="cat-particle-stage"
        aria-label="可互动的宇宙星系、星云与粒子星尘"
    ></canvas>

    <div class="particle-ambient" aria-hidden="true"></div>
    <div class="particle-vignette" aria-hidden="true"></div>

    <div class="space-drag-hint" aria-hidden="true">
        <span></span>
        拖曳探索 360° 宇宙
    </div>

    <main class="particle-entry" aria-label="博客入口">
        <a class="particle-enter" href="{{ '/blog/' | relative_url }}" aria-label="探索 Xueyuan 的技术宇宙，进入博客">
            <span class="particle-enter__copy">
                <small>深空坐标 · 技术博客</small>
                <strong>探索 Xueyuan 的技术宇宙</strong>
            </span>
            <b aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M13.7 4.3c2.9-2.9 6.5-2.3 6.5-2.3s.6 3.6-2.3 6.5l-5.7 5.7-5.1-5.1 6.6-4.8Z"></path>
                    <path d="m8.8 11.1-3.7 3.7-2.5.6.7-2.4 3.8-3.8M11.1 13.4l-1.7 5.2 1.1 2.8 1.3-2.6 3.3-3.3"></path>
                    <circle cx="15.8" cy="6.2" r="1.45"></circle>
                </svg>
            </b>
        </a>

        <div class="particle-controls" aria-label="视角控制">
            <button class="particle-reset" type="button" data-particle-reset aria-label="重置宇宙视角" title="重置宇宙视角">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M19.1 7.7A8 8 0 1 0 20 15.2"></path>
                    <path d="M19.1 3.5v4.2h-4.2"></path>
                    <circle cx="12" cy="12" r="1.55"></circle>
                </svg>
            </button>
        </div>

    </main>

    <div class="launch-transition" data-launch-transition aria-hidden="true">
        <canvas class="launch-transition__canvas"></canvas>
        <div class="launch-transition__portal" aria-hidden="true">
            <span></span>
        </div>
        <div class="launch-transition__rocket" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
                <path d="M13.7 4.3c2.9-2.9 6.5-2.3 6.5-2.3s.6 3.6-2.3 6.5l-5.7 5.7-5.1-5.1 6.6-4.8Z"></path>
                <path d="m8.8 11.1-3.7 3.7-2.5.6.7-2.4 3.8-3.8M11.1 13.4l-1.7 5.2 1.1 2.8 1.3-2.6 3.3-3.3"></path>
                <circle cx="15.8" cy="6.2" r="1.45"></circle>
            </svg>
        </div>
        <div class="launch-transition__copy" aria-hidden="true">
            <small>跃迁航线已锁定</small>
            <strong>航向 Xueyuan 的技术宇宙</strong>
        </div>
    </div>

    <p class="space-credit">360° 全天星空影像：ESO / S. Brunier</p>

    <div class="particle-loading" role="status" aria-live="polite">
        <span class="particle-loading__signal" aria-hidden="true"></span>
        <span class="particle-loading__copy">
            <strong>正在接收原始星图</strong>
            <small>6000 × 3000 · 360° HIGH RESOLUTION</small>
        </span>
        <span class="particle-loading__track" aria-hidden="true"><i></i></span>
    </div>

    <div class="particle-fallback" role="status">
        <p>互动宇宙暂时无法显示</p>
        <a href="{{ '/blog/' | relative_url }}">进入博客 →</a>
    </div>

    <noscript>
        <div class="particle-noscript">需要启用 JavaScript 才能观看互动宇宙。<a href="{{ '/blog/' | relative_url }}">进入博客</a></div>
    </noscript>

    <script src="{{ '/assets/js/particle-cat.js' | relative_url }}" defer></script>
</body>
</html>
