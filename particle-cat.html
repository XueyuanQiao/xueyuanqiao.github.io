---
layout: null
permalink: /
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#02050b">
    <meta name="color-scheme" content="dark">
    <title>{{ site.title }}</title>
    <meta name="description" content="由猫猫头像生成的实时互动粒子点云首页。">
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/particle-cat.css' | relative_url }}">
</head>
<body>
    <canvas
        id="cat-particle-stage"
        data-model-src="{{ '/images/cat-particle-avatar.webp' | relative_url }}"
        aria-label="由猫猫头像生成的可互动彩色粒子点云"
    ></canvas>

    <div class="particle-ambient" aria-hidden="true"></div>
    <div class="particle-vignette" aria-hidden="true"></div>

    <main class="particle-entry" aria-label="博客入口">
        <a class="particle-enter" href="{{ '/blog/' | relative_url }}">
            <span>进入博客</span>
            <b aria-hidden="true">→</b>
        </a>

        <div class="particle-controls" aria-label="粒子效果开关">
            <button type="button" data-particle-trigger>扩散粒子</button>
            <button type="button" data-particle-flow aria-pressed="true">呼吸流动：开</button>
            <button type="button" data-particle-glow aria-pressed="true">粒子辉光：开</button>
            <button class="particle-reset" type="button" data-particle-reset aria-label="重置猫猫点云" title="重置猫猫点云">重置点云</button>
        </div>

        <p class="particle-hint">移动鼠标推开粒子 · 离开后弹性归位 · 拖曳旋转 · 单击释放波纹</p>
    </main>

    <p class="particle-loading" role="status">正在生成猫猫粒子点云…</p>

    <div class="particle-fallback" role="status">
        <p>粒子效果暂时无法显示</p>
        <a href="{{ '/blog/' | relative_url }}">进入博客 →</a>
    </div>

    <noscript>
        <div class="particle-noscript">需要启用 JavaScript 才能观看猫猫粒子。<a href="{{ '/blog/' | relative_url }}">进入博客</a></div>
    </noscript>

    <script src="{{ '/assets/js/particle-cat.js' | relative_url }}" defer></script>
</body>
</html>
