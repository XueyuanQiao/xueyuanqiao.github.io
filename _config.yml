# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Xueyuan's Tech Blog
email: 1336582921@qq.com
description: > # this means to ignore newlines until "baseurl:"
  Xueyuan's Blog · 质量工程、AI 全栈实践与 AI 音乐创作
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://xueyuanqiao.github.io" # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb
github_username:  XueyuanQiao
music_artist: xueyuan
music_tracks:
  - title: King Without a Crown
    file: /assets/audio/King_Without_a_Crown.mp3
    duration: "2:55"
  - title: Bunker Logic
    file: /assets/audio/Bunker_Logic.mp3
    duration: "2:21"
  - title: Burning Low
    file: /assets/audio/Burning_Low.mp3
    duration: "0:30"
netease_music_url: https://163cn.tv/bblZtmc9
qq_music_url: https://c6.y.qq.com/base/fcgi-bin/u?__=GWOcn49RH2fI

# Build settings
markdown: kramdown
# theme: minima  # 移除默认主题，使用自定义样式
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

excerpt_separator: "<!-- more -->"

# 允许构建未来日期的文章（避免按本地时区写作时被 Jekyll 过滤）
future: true

# path
categories_path: /cate/

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - doc/
  - tmp/
  - SECURITY_UPDATE.md
  - images/head.original.jpeg
  - images/head.jpeg.bak
